build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  CyclomaticComplexMethod:
    active: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
  LongMethod:
    active: true
    threshold: 25
    ignoreAnnotated:
      - 'Test'
      - 'DisplayName'
      - 'ParameterizedTest'
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true

naming:
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][_A-Z0-9]*'

style:
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludeReturnFromLambda: true
  MaxLineLength:
    active: true
    maxLineLength: 140
  UnusedPrivateProperty:
    active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
  LoopWithTooManyJumpStatements:
    active: true
  WildcardImport:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  TrailingWhitespace:
    active: true
  NewLineAtEndOfFile:
    active: true
